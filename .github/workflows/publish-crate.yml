name: Publish crate

on:
  workflow_call:

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Validate release tag
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          cargo_toml = pathlib.Path("Cargo.toml")
          version = tomllib.loads(cargo_toml.read_text())["package"]["version"]
          expected = f"v{version}"
          actual = os.environ["EXPECTED_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match Cargo.toml version {expected!r}"
              )
          print(f"validated release tag {actual}")
          PY

      - name: Ensure version is not already published
        run: |
          version="$(python3 - <<'PY'
          import pathlib
          import tomllib
          cargo_toml = pathlib.Path("Cargo.toml")
          print(tomllib.loads(cargo_toml.read_text())["package"]["version"])
          PY
          )"

          status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header 'User-Agent: clipmem-release-workflow (https://github.com/tristanmanchester/clipmem)' \
              "https://crates.io/api/v1/crates/clipmem/${version}"
          )"
          if [ "${status}" = "200" ]; then
            echo "clipmem ${version} is already published on crates.io" >&2
            exit 1
          fi

          if [ "${status}" != "404" ]; then
            echo "unexpected crates.io response while checking clipmem ${version}: ${status}" >&2
            exit 1
          fi

      - name: Run release verification
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          python3 scripts/check_file_lengths.py
          python3 scripts/check_version_sync.py
          cargo test
          cargo publish --dry-run --locked
          cargo package --list

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
